<div class="create-header">
  <button (click)="cancel()" class="back-btn">&larr; Zurück</button>
  <h2>Neues Ticket</h2>
</div>

<div class="create-content">
  <form (ngSubmit)="onSubmit()" class="create-form">
    @if (error()) {
      <div class="error-msg">{{ error() }}</div>
    }

    <div class="form-group">
      <label for="subject">Betreff</label>
      <input
        id="subject"
        type="text"
        [(ngModel)]="subject"
        name="subject"
        placeholder="Kurze Beschreibung des Problems"
        required
      />
    </div>

    <div class="form-group">
      <label for="priority">Priorität</label>
      <select id="priority" [(ngModel)]="priority" name="priority">
        <option [ngValue]="1">Low</option>
        <option [ngValue]="2">Normal</option>
        <option [ngValue]="3">High</option>
        <option [ngValue]="4">Critical</option>
      </select>
    </div>

    <div class="form-group">
      <label for="description">Beschreibung</label>
      <textarea
        id="description"
        [(ngModel)]="description"
        name="description"
        rows="8"
        placeholder="Details zum Problem..."
        required
      ></textarea>
    </div>

    <div class="form-actions">
      <button type="button" (click)="cancel()" class="btn btn-secondary">
        Abbrechen
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading() || !subject.trim() || !description.trim()"
      >
        {{ loading() ? 'Wird erstellt...' : 'Ticket erstellen' }}
      </button>
    </div>
  </form>
</div>
