<aside class="sidebar">
  <button class="sidebar-close" (click)="closeSidebar.emit()">&times;</button>
  <div class="sidebar-header">
    <img src="logo.png" alt="FluxDesk" class="sidebar-logo" />
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/tickets' }"
        class="nav-item"
      >
        <lucide-icon [img]="item.icon" [size]="18" class="nav-icon"></lucide-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <button (click)="themeToggle.emit()" class="theme-toggle">
      <lucide-icon [img]="themeIcon()" [size]="18"></lucide-icon>
    </button>

    @if (auth.currentUser(); as user) {
      <div class="user-section">
        <div class="user-avatar">{{ initials() }}</div>
        <div class="user-info">
          <span class="user-name">{{ user.first_name }} {{ user.last_name }}</span>
          <span class="user-role">{{ user.role }}</span>
        </div>
      </div>
    }
    <button (click)="auth.logout()" class="logout-btn">
      <lucide-icon [img]="icons.LogOut" [size]="14"></lucide-icon>
      Abmelden
    </button>
  </div>
</aside>
